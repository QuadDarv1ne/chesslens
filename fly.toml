# Конфигурация деплоя на Fly.io (https://fly.io).
# Быстрый старт:
#   fly auth login
#   fly launch --no-deploy   # создаст приложение (можно сменить имя и регион)
#   fly deploy
# Полная инструкция — в DEPLOY.md.

app = "chesslens-ru"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # SQLite с авторизацией и платежами живёт на постоянном томе /data.
  # Том создаётся командой: fly volumes create chesslens_data --size 1 --region ams
  DATABASE_URL = "file:/data/chesslens.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Платформа проверяет здоровье сервиса этим эндпоинтом
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    # Next.js standalone стартует за 2–4 с, но при cold start (suspend)
    # и пересборке даём запас, чтобы healthcheck не флапал.
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

# Постоянный том для SQLite (аккаунты, сессии, подписки, платежи).
[mounts]
  source = "chesslens_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
