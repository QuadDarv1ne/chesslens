# Blueprint деплоя на Render (https://render.com).
# Использование: Dashboard -> New -> Blueprint -> выберите репозиторий -> Apply.
# После этого Render будет автоматически пересобирать сервис при каждом git push.

services:
  - type: web
    name: chesslens
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # free: сервис засыпает без трафика; для диска под БД нужен план Starter+
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # База данных сейчас не используется (анализ идёт в браузере).
      # Если позже понадобится SQLite — на плане Starter+ добавьте диск
      # с mount path /data и задайте DATABASE_URL=file:/data/chesslens.db.

# Опционально для платных планов: постоянный диск под SQLite.
# Раскомментируйте и смените plan на starter (или выше):
#    disk:
#      name: chesslens-data
#      diskSizeGB: 1
#      mountPath: /data
